# Real Entra tenant as the upstream, in place of the stand-in. NOT yet verified against a real
# tenant: treat the first run as a test of this file too. Select it in .env (see .env.example).
#
# Entra cannot be stopped to simulate an outage. Use the operator override instead:
#   curl -s -X POST localhost:8081/operator/mode -H 'content-type: application/json' \
#     -d '{"override":"ForceDegraded","reason":"drill"}'
services:
  # Not started in this mode.
  fake-entra:
    profiles: ["stand-in-upstream"]

  keycloak:
    environment:
      MIF_UPSTREAM_CLIENT_ID: ${ENTRA_BROKER_CLIENT_ID:?Set ENTRA_BROKER_CLIENT_ID in .env}
      MIF_UPSTREAM_CLIENT_SECRET: ${ENTRA_BROKER_CLIENT_SECRET:?Set ENTRA_BROKER_CLIENT_SECRET in .env}
      MIF_UPSTREAM_ISSUER: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}/v2.0
      MIF_UPSTREAM_AUTHORIZATION_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/authorize
      MIF_UPSTREAM_TOKEN_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token
      MIF_UPSTREAM_JWKS_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/discovery/v2.0/keys

  mif-node:
    environment:
      Mif__Upstream__DiscoveryUrl: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0/.well-known/openid-configuration
      # The token probe runs only when a probe client is configured. Without one the node checks
      # the discovery document and signing keys only.
      Mif__Upstream__ProbeTokenUrl: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token
      Mif__Upstream__ProbeClientId: ${ENTRA_PROBE_CLIENT_ID:-}
      Mif__Upstream__ProbeClientSecret: ${ENTRA_PROBE_CLIENT_SECRET:-}
      Mif__Upstream__ProbeScope: ${ENTRA_PROBE_SCOPE:-https://graph.microsoft.com/.default}
      Mif__Upstream__TimeoutSeconds: "5"
      # Slower than the simulation, so that one slow answer from Entra does not flip the mode.
      Mif__Continuity__ProbeIntervalSeconds: "15"
      Mif__Continuity__FailureThreshold: "4"
      Mif__Continuity__RecoveryThreshold: "4"
